# ==============================================================================
# Render Blueprint - AI Crop Platform Production Deployment
# ==============================================================================
services:
  - type: web
    name: ai-crop-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: AICrop-Production-Backend
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: MONGODB_DB_NAME
        value: aicrop_db
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://*.netlify.app,*"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
